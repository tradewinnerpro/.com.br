    //  É DETECTADO PELOS PARÂMETROS DA URL (vindos do index)
    // ══════════════════════════════════════════════════════
    function processarNovoClienteURL() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('novo') !== '1') return;

        var nome     = params.get('nome');
        var whatsapp = params.get('whatsapp');
        var email    = params.get('email');
        var terminal = params.get('terminal');
        var chave    = params.get('chave');
        var expira   = params.get('expira');
        var plano    = params.get('plano') || 'LATAO';

        if (!nome || !terminal || !chave) return;

        // Evita reenvio se a mesma página for recarregada
        var notifKey = 'notif_admin_' + terminal;
        if (sessionStorage.getItem(notifKey)) return;

        var fd = new FormData();
        fd.append('_subject', '🚀 Novo cliente - TRADE WINNER PRO');
        fd.append('nome', nome);
        fd.append('whatsapp', whatsapp);
        fd.append('email', email);
        fd.append('terminal', terminal);
        fd.append('chave', chave);
        fd.append('plano', plano);
        fd.append('validade', expira);
        fd.append('link_ea', LINK_EA);
        fd.append('link_pdf', LINK_PDF);

        fetch('https://formspree.io/f/xgorqjba', {
            method: 'POST',
            body: fd,
            headers: { 'Accept': 'application/json' }
        })
        .then(function(response) {
            if (response.ok) {
                sessionStorage.setItem(notifKey, '1');
                console.log('📧 Notificação de novo cliente enviada para o admin.');
            }
        })
        .catch(function(err) {
            console.error('Erro ao enviar notificação:', err);
        });
    }

                    renderizarTudo();
                }
            }catch(e){}
        }
        atualizarContadorNotificacoes();
    },3000);

})();
