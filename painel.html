    // ⭐⭐⭐ FUNÇÃO NOVA: Sincronizar com JSONbin (NÃO apaga nada!) ⭐⭐⭐

    // Mensagens padrão
    const MENSAGENS_PADRAO = {

        vencido: `⛔ SEU TESTE EXPIRU!\n\nOlá {nome}!\n\n❌ Seu plano {plano} expirou em {validade}.\n\n⚡ RENOVE AGORA:\n👉 BRONZE (30d) R$47: https://pag.ae/81Jw7qy2N\n👉 PRATA (90d) R$127: https://pag.ae/81Jw7ZCg6\n👉 OURO (180d) R$227: https://pag.ae/81Jw8oyYM\n👉 DIAMANTE (270d) R$307: https://pag.ae/81Jw8RJ16\n👉 ELITE (365d) R$367: https://pag.ae/81Jw9ggEr\n\n📞 Suporte: (41) 99976-5210`,

        planos: `📢 PLANOS TRADE WINNER PRO\n\nOlá {nome}!\n\n💰 ESCOLHA SEU PLANO:\n\n🔰 BRONZE (30 dias) - R$ 47\n👉 https://pag.ae/81Jw7qy2N\n\n🥈 PRATA (90 dias) - R$ 127\n👉 https://pag.ae/81Jw7ZCg6\n\n🥇 OURO (180 dias) - R$ 227\n👉 https://pag.ae/81Jw8oyYM\n\n💎 DIAMANTE (270 dias) - R$ 307\n👉 https://pag.ae/81Jw8RJ16\n\n👑 ELITE (365 dias) - R$ 367\n👉 https://pag.ae/81Jw9ggEr\n\n⚡ Pague e envie o comprovante!\n\n📞 Dúvidas: (41) 99976-5210`,
        
        entrega: `🎯 TRADE WINNER PRO - Licença Ativada!\n\nOlá {nome}!\n\n✅ Seu plano {plano} foi ativado!\n🔑 Chave: {chave}\n📅 Válida por: {dias} dias\n\n📥 Baixe o EA: {link_ea}\n📘 Manual PDF: {link_pdf}\n\nSuporte: (41) 99976-5210`
    };
    
    let configMensagens = JSON.parse(localStorage.getItem('twpro_mensagens')) || MENSAGENS_PADRAO;
    let configPrecos = JSON.parse(localStorage.getItem('twpro_precos')) || {latao:0, bronze:47, prata:127, ouro:227, diamante:307, elite:367};
    
    function processarMensagem(tipo, cliente) {
        let msg = configMensagens[tipo] || MENSAGENS_PADRAO[tipo];
        let dataCadastro = new Date(cliente.dataCadastro).toLocaleDateString('pt-BR');
        let validade = new Date(cliente.expira).toLocaleDateString('pt-BR');
        let dias = Math.max(0, Math.ceil((new Date(cliente.expira) - new Date()) / 86400000));
        
        return msg
            .replace(/{nome}/g, cliente.nome)
            .replace(/{plano}/g, cliente.plano)
            .replace(/{chave}/g, cliente.chave)
            .replace(/{dias}/g, dias)
            .replace(/{data_cadastro}/g, dataCadastro)
            .replace(/{validade}/g, validade)
            .replace(/{terminal_id}/g, cliente.terminal)
            .replace(/{whatsapp}/g, cliente.whats)
            .replace(/{link_ea}/g, LINK_EA)
            .replace(/{link_pdf}/g, LINK_PDF);
    }
    
    window.enviarMensagem = function(clienteId, tipo) {
        let cliente = clientes.find(c => c.id == clienteId);
        if(!cliente) return alert('Cliente não encontrado!');
        
        let mensagem = processarMensagem(tipo, cliente);
        
        // Enviar WhatsApp
        if(confirm(`Enviar mensagem para ${cliente.nome} via WhatsApp?`)) {
            let numero = cliente.whats.replace(/\D/g, '');

                window.open('https://wa.me/' + numero + '?text=' + encodeURIComponent(mensagem), '_blank');
            } else {
                alert('WhatsApp não cadastrado!');
            }
        }
        
        // Enviar Email
        if(cliente.email && confirm(`Enviar também por EMAIL para ${cliente.email}?`)) {
            emailjs.send("service_kqme5zs", "template_rlrvpbm", {
                to_email: cliente.email,
                to_name: cliente.nome,
                nome: cliente.nome,
                chave: cliente.chave,
                expira: new Date(cliente.expira).toLocaleDateString('pt-BR'),
                plano: cliente.plano,
                link_ea: LINK_EA,
                link_pdf: LINK_PDF,
                whatsapp: cliente.whats,
                terminal_id: cliente.terminal,
                validade: new Date(cliente.expira).toLocaleDateString('pt-BR')
            }).then(() => alert('✅ Email enviado!')).catch(e => alert('❌ Erro ao enviar email: ' + e));
        }
    };
    
    window.abrirEnviarMensagem = function() {
        if(clientes.length === 0) return alert('⚠️ Nenhum cliente cadastrado!');
        
        let html = `
            <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:10000;display:flex;align-items:center;justify-content:center;" id="modalEnviarMsg">
                <div style="background:#13131a;border:2px solid #c9a84c;border-radius:20px;padding:2rem;max-width:500px;width:95%;">
                    <h3 style="color:#e8c96a;margin-bottom:1.5rem;text-align:center;">📨 ENVIAR MENSAGEM</h3>
                    <div class="fg"><label>👤 CLIENTE:</label><select id="selectCliente" style="background:#09090d;border:1px solid #2a2a38;border-radius:8px;color:#e8e8f0;padding:.65rem;width:100%;"><option value="">-- Selecione --</option>${clientes.map(c => `<option value="${c.id}">${c.nome} - ${c.whats} (${c.plano})</option>`).join('')}</select></div>
                    <div class="fg"><label>📝 TIPO:</label><select id="selectTipo" style="background:#09090d;border:1px solid #2a2a38;border-radius:8px;color:#e8e8f0;padding:.65rem;width:100%;"><option value="quase_vencendo">⚠️ QUASE VENCENDO</option><option value="vencido">❌ VENCIDO</option><option value="boas_vindas">🎯 BOAS VINDAS</option><option value="planos">💰 LISTA DE PLANOS</option><option value="entrega">🔑 ENTREGA DE CHAVE</option></select></div>
                    <div style="display:flex;gap:10px;margin-top:1.5rem;"><button class="btn-primary" onclick="enviarMensagemSelecionada()" style="flex:1;">📤 ENVIAR</button><button class="btn-ghost" onclick="fecharModalEnviarMsg()" style="flex:1;">❌ CANCELAR</button></div>
                </div>
            </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
    };
    
    window.fecharModalEnviarMsg = function() {
        let modal = document.getElementById('modalEnviarMsg');
        if(modal) modal.remove();
    };
    
    window.enviarMensagemSelecionada = function() {
        let clienteId = document.getElementById('selectCliente').value;
        let tipo = document.getElementById('selectTipo').value;
        if(!clienteId) return alert('⚠️ Selecione um cliente!');
        fecharModalEnviarMsg();
        enviarMensagem(clienteId, tipo);
    };
    
    function gerarHashBase(terminal) {
        let data = terminal + SALT, hash = 0;
        for(let i = 0; i < data.length; i++) { let c = data.charCodeAt(i); hash = ((hash << 5) - hash) + c; hash = hash & 0x7FFFFFFF; }
        let a = Math.abs(hash), p1 = a % 10000, p2 = Math.floor(a / 10000) % 10000, p3 = Math.floor(a / 100000000) % 10000;
        const l = "ABCDEFGHJKLMNPQRSTUVWXYZ";
        return l.charAt(p1 % l.length) + l.charAt(p2 % l.length) + l.charAt(p3 % l.length) + "-" + String(p1).padStart(4, '0') + "-" + String(p2 % 1000).padStart(3, '0') + "-" + String(p3 % 1000).padStart(3, '0');
    }
    
    function gerarChaveCompleta(t, p) { return p + "-" + gerarHashBase(t); }
    
    window.selecionarPlano = function(p, d, v, e) {
        planoSelecionado = p;
        diasSelecionados = d;
        document.querySelectorAll('.plano-card').forEach(c => c.classList.remove('active'));
        e.classList.add('active');
        document.getElementById('valorInput').value = v;
    };
    
    window.cadastrarCliente = function() {
        let nome = document.getElementById('nomeInput').value.trim();
        let whats = document.getElementById('whatsInput').value.trim();
        let email = document.getElementById('emailInput').value.trim();
        let terminal = document.getElementById('terminalInput').value.trim();
        let valor = parseFloat(document.getElementById('valorInput').value) || 0;
        let dataCompra = document.getElementById('dataCompraInput').value;
        
        if(!nome || !whats || !terminal) return alert('⚠️ Preencha Nome, WhatsApp e ID Terminal!');
        if(!dataCompra) { let h = new Date(); dataCompra = h.getFullYear() + '-' + String(h.getMonth()+1).padStart(2,'0') + '-' + String(h.getDate()).padStart(2,'0'); }
        
        let chave = gerarChaveCompleta(terminal, planoSelecionado);
        let agora = new Date();
        let expira = new Date(agora);
        expira.setDate(agora.getDate() + diasSelecionados);
        
        let novoCliente = {
            id: Date.now() + '_' + Math.random(),
            nome: nome, whats: whats, email: email,
            terminal: terminal, valor: valor, chave: chave,
            dataCadastro: agora.toISOString(), expira: expira.toISOString(),
            plano: planoSelecionado, dias: diasSelecionados, dataCompra: dataCompra
        };
        
        clientes.push(novoCliente);
        salvarClientes();
        
        document.getElementById('chaveGeradaDisplay').textContent = chave;
        document.getElementById('planoGeradoBadge').textContent = planoSelecionado;
        document.getElementById('planoGeradoBadge').className = 'badge-plano badge-' + planoSelecionado.toLowerCase();
        document.getElementById('chaveGeradaBox').classList.add('show');
        
        ['nomeInput','whatsInput','terminalInput','emailInput'].forEach(id => document.getElementById(id).value = '');
        
        renderizarTabela();
        atualizarContadores();
        
        if(email) {
            emailjs.send("service_kqme5zs", "template_rlrvpbm", {
                to_email: email, to_name: nome, nome: nome,
                chave: chave, expira: expira.toLocaleDateString('pt-BR'),
                plano: planoSelecionado + ' ' + diasSelecionados + ' dias',
                link_ea: LINK_EA, link_pdf: LINK_PDF,
                whatsapp: whats, terminal_id: terminal,
                validade: expira.toLocaleDateString('pt-BR')
            }).catch(e => console.log('Erro email:', e));
        }
        
        alert('✅ Cliente cadastrado com sucesso!\n🔑 Chave: ' + chave);
    };
    
    window.enviarWhatsAppChaveGerada = function() {
        let chave = document.getElementById('chaveGeradaDisplay').textContent;
        if(chave) navigator.clipboard.writeText(chave).then(() => alert('✅ Chave copiada! Cole no WhatsApp'));
    };
    
    window.enviarEmailChaveGerada = function() { alert('📧 Email enviado para o cliente!'); };
    window.copiarChaveGerada = function() { 
        let chave = document.getElementById('chaveGeradaDisplay').textContent;
        if(chave) navigator.clipboard.writeText(chave).then(() => alert('✅ Chave copiada!'));
    };
    
    function salvarClientes() { localStorage.setItem('twpro_clientes', JSON.stringify(clientes)); }
    
    function carregarClientes() {
        let data = localStorage.getItem('twpro_clientes');
        if(data) { try { clientes = JSON.parse(data); } catch(e) { clientes = []; } }
        renderizarTabela();
        atualizarContadores();
        calcularFaturamento();
        
        // ⭐ Sincronizar após carregar
        sincronizarComJSONbin();
    }
    
    window.renderizarTabela = function() {
        let busca = document.getElementById('buscaInput').value.toLowerCase();
        let hoje = new Date(); hoje.setHours(0,0,0,0);
        
        let lista = clientes.filter(c => {
            let match = !busca || c.nome.toLowerCase().includes(busca) || c.whats.includes(busca) || c.terminal.includes(busca);
            if(!match) return false;
            let exp = new Date(c.expira); exp.setHours(0,0,0,0);
            let diff = Math.ceil((exp - hoje) / 86400000);
            if(filtroStatus === 'ativos') return diff > 0;
            if(filtroStatus === 'vencendo') return diff === 0;
            if(filtroStatus === 'vencidos') return diff < 0;
            return true;
        });
        
        lista.sort((a,b) => new Date(a.expira) - new Date(b.expira));
        
        let tbody = document.getElementById('tabelaBody');
        if(!lista.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem">Nenhum cliente cadastrado</td></tr>';
            return;
        }
        
        tbody.innerHTML = lista.map(c => {
            let exp = new Date(c.expira);
            let diff = Math.ceil((exp - new Date()) / 86400000);
            let statusClass, statusText;
            if(diff < 0) { statusClass = 'status-vencido'; statusText = 'VENCIDO'; }
            else if(diff === 0) { statusClass = 'status-vencendo'; statusText = 'VENCE HOJE'; }
            else { statusClass = 'status-ativo'; statusText = 'ATIVO'; }
            
            return `<tr>
                <td><div class="client-name">${c.nome}</div><div class="client-detail">${c.whats}${c.email ? ' | '+c.email : ''}</div></td>
                <td>${c.terminal}</td>
                <td><span class="chave-display">${c.chave}</span></td>
                <td><span class="badge-plano badge-${(c.plano||'LATAO').toLowerCase()}">${c.plano}</span></td>
                <td>${exp.toLocaleDateString('pt-BR')}<br><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>R$ ${(c.valor||0).toFixed(2)}</td>
                <td><div class="action-btns">
                    <button class="btn-icon btn-icon-chave" onclick="enviarMensagem('${c.id}','entrega')" title="Enviar Chave">🔑</button>
                    <button class="btn-icon btn-icon-edit" onclick="editarCliente('${c.id}')" title="Editar">✏️</button>
                    <button class="btn-icon btn-icon-email" onclick="enviarEmailCliente('${c.id}')" title="Email">📧</button>
                    <button class="btn-icon btn-icon-warning" onclick="enviarMensagem('${c.id}','quase_vencendo')" title="Aviso">⚠️</button>
                    <button class="btn-icon btn-icon-planos" onclick="enviarMensagem('${c.id}','planos')" title="Planos">💰</button>
                    <button class="btn-icon btn-icon-delete" onclick="removerCliente('${c.id}')" title="Excluir">🗑️</button>
                </div></td>
            </tr>`;
        }).join('');
    };
    
    window.enviarEmailCliente = function(id) {
        let c = clientes.find(x => x.id == id);
        if(!c || !c.email) return alert('Cliente sem email!');
        emailjs.send("service_kqme5zs","template_rlrvpbm",{
            to_email:c.email,to_name:c.nome,nome:c.nome,chave:c.chave,
            expira:new Date(c.expira).toLocaleDateString('pt-BR'),plano:c.plano,
            link_ea:LINK_EA,link_pdf:LINK_PDF,whatsapp:c.whats,
            terminal_id:c.terminal,validade:new Date(c.expira).toLocaleDateString('pt-BR')
        }).then(()=>alert('✅ Email enviado!')).catch(e=>alert('❌ Erro: '+e));
    };
    
    window.editarCliente = function(id) {
        let c = clientes.find(x => x.id == id);
        if(!c) return;
        let diasRest = Math.max(0, Math.ceil((new Date(c.expira) - new Date()) / 86400000));
        let html = `<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;" id="modalEditar"><div style="background:#13131a;border:2px solid #c9a84c;border-radius:20px;padding:2rem;max-width:500px;width:90%;"><h3 style="color:#e8c96a;margin-bottom:1rem;">✏️ Editar ${c.nome}</h3><p style="color:#3ecf8e;">📅 Dias restantes: ${diasRest}</p><p style="color:#8888a8;">🔑 Chave: ${c.chave}</p><hr style="margin:1rem 0;border-color:#2a2a38;"><div class="fg"><label>Novo Plano:</label><select id="novoPlanoSelect"><option value="LATAO,7,0">🔰 LATÃO 7d - GRÁTIS</option><option value="BRONZE,30,47">🥉 BRONZE 30d - R$47</option><option value="PRATA,90,127">🥈 PRATA 90d - R$127</option><option value="OURO,180,227">🥇 OURO 180d - R$227</option><option value="DIAMANTE,270,307">💎 DIAMANTE 270d - R$307</option><option value="ELITE,365,367">👑 ELITE 365d - R$367</option></select></div><div class="fg"><label>Valor Adicional (R$):</label><input type="number" id="adicionalValor" value="0" step="0.01"></div><button class="btn-primary" onclick="confirmarEdicao('${c.id}',${diasRest})">✅ CONFIRMAR</button><button class="btn-ghost" onclick="document.getElementById('modalEditar').remove()" style="margin-top:.5rem">❌ CANCELAR</button></div></div>`;
        document.body.insertAdjacentHTML('beforeend', html);
    };
    
    window.confirmarEdicao = function(id, diasRestantes) {
        let c = clientes.find(x => x.id == id);
        if(!c) return;
        let select = document.getElementById('novoPlanoSelect');
        let [plano, diasNovo, valorNovo] = select.value.split(',');
        let adicional = parseFloat(document.getElementById('adicionalValor').value) || 0;
        let diasTotal = diasRestantes + parseInt(diasNovo);
        c.plano = plano; c.dias = diasTotal;
        c.chave = plano + "-" + gerarHashBase(c.terminal);
        c.valor += parseFloat(valorNovo) + adicional;
        c.expira = new Date(Date.now() + diasTotal * 86400000).toISOString();
        salvarClientes();
        document.getElementById('modalEditar').remove();
        renderizarTabela();
        alert(`✅ Cliente atualizado!\n👤 ${c.nome}\n🏷️ ${plano}\n📅 ${diasTotal} dias\n🔑 ${c.chave}`);
        let msg = `🎯 Plano Atualizado!\n\nOlá ${c.nome}!\n\n✅ Novo plano: ${plano}\n📅 Total: ${diasTotal} dias\n🔑 Nova chave: ${c.chave}`;
        let numero = c.whats.replace(/\D/g,'');
        if(numero) window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(msg),'_blank');
    };
    
    window.removerCliente = function(id) {
        if(confirm('🗑️ Remover este cliente?')) {
            clientes = clientes.filter(c => c.id != id);
            salvarClientes();
            renderizarTabela();
            atualizarContadores();
            calcularFaturamento();
        }
    };
    
    function atualizarContadores() {
        let hoje = new Date(); hoje.setHours(0,0,0,0);
        let total = clientes.length, ativos = 0, venceHoje = 0, vencidos = 0;
        clientes.forEach(c => {
            let exp = new Date(c.expira); exp.setHours(0,0,0,0);
            let diff = Math.ceil((exp - hoje) / 86400000);
            if(diff > 0) ativos++;
            else if(diff === 0) venceHoje++;
            else vencidos++;
        });
        document.getElementById('countTodos').textContent = total;
        document.getElementById('countAtivos').textContent = ativos;
        document.getElementById('countVencendo').textContent = venceHoje;
        document.getElementById('countVencidos').textContent = vencidos;
    }
    
    function calcularFaturamento() {
        let total = clientes.reduce((sum, c) => sum + (c.valor || 0), 0);
        document.getElementById('totalFaturamento').textContent = 'R$ ' + total.toFixed(2);
    }
    
    window.setFiltroStatus = function(f) {
        filtroStatus = f;
        document.querySelectorAll('.status-card').forEach(c => c.classList.remove('active'));
        document.getElementById('status'+f.charAt(0).toUpperCase()+f.slice(1)).classList.add('active');
        renderizarTabela();
    };
    
    window.setPeriodo = function(p) {
        ['periodoTudo','periodoHoje','periodoMes','periodoAno'].forEach(id => document.getElementById(id).classList.remove('active'));
        document.getElementById('periodo'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');
        calcularFaturamento();
    };
    
    window.abrirModalMensagens = function() {
        document.getElementById('msgQuaseVencendo').value = configMensagens.quase_vencendo || '';
        document.getElementById('msgVencido').value = configMensagens.vencido || '';
        document.getElementById('msgBoasVindas').value = configMensagens.boas_vindas || '';
        document.getElementById('msgPlanos').value = configMensagens.planos || '';
        document.getElementById('msgEntrega').value = configMensagens.entrega || '';
        document.getElementById('modalMensagens').classList.add('show');
        document.getElementById('modalOverlay').classList.add('show');
    };
    
    window.abrirModalPrecos = function() {
        document.getElementById('precoLatao').value = configPrecos.latao;
        document.getElementById('precoBronze').value = configPrecos.bronze;
        document.getElementById('precoPrata').value = configPrecos.prata;
        document.getElementById('precoOuro').value = configPrecos.ouro;
        document.getElementById('precoDiamante').value = configPrecos.diamante;
        document.getElementById('precoElite').value = configPrecos.elite;
        document.getElementById('modalPrecos').classList.add('show');
        document.getElementById('modalOverlay').classList.add('show');
    };
    
    window.salvarMensagens = function() {
        configMensagens = {
            quase_vencendo: document.getElementById('msgQuaseVencendo').value,
            vencido: document.getElementById('msgVencido').value,
            boas_vindas: document.getElementById('msgBoasVindas').value,
            planos: document.getElementById('msgPlanos').value,
            entrega: document.getElementById('msgEntrega').value
        };
        localStorage.setItem('twpro_mensagens', JSON.stringify(configMensagens));
        fecharModais();
        alert('✅ Mensagens salvas!');
    };
    
    window.salvarPrecos = function() {
        configPrecos = {
            latao: parseFloat(document.getElementById('precoLatao').value)||0,
            bronze: parseFloat(document.getElementById('precoBronze').value)||47,
            prata: parseFloat(document.getElementById('precoPrata').value)||127,
            ouro: parseFloat(document.getElementById('precoOuro').value)||227,
            diamante: parseFloat(document.getElementById('precoDiamante').value)||307,
            elite: parseFloat(document.getElementById('precoElite').value)||367
        };
        localStorage.setItem('twpro_precos', JSON.stringify(configPrecos));
        document.querySelector('.plano-bronze .plano-valor').textContent = 'R$ ' + configPrecos.bronze;
        document.querySelector('.plano-prata .plano-valor').textContent = 'R$ ' + configPrecos.prata;
        document.querySelector('.plano-ouro .plano-valor').textContent = 'R$ ' + configPrecos.ouro;
        document.querySelector('.plano-diamante .plano-valor').textContent = 'R$ ' + configPrecos.diamante;
        document.querySelector('.plano-elite .plano-valor').textContent = 'R$ ' + configPrecos.elite;
        fecharModais();
        alert('✅ Preços salvos!');
    };
    
    window.fecharModais = function() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        document.getElementById('modalOverlay').classList.remove('show');
    };
    
    window.verificarSenha = function() {
        if(document.getElementById('senhaLoginInput').value === SENHA_MESTRA) {
            logado = true;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('conteudoPrincipal').classList.add('desbloqueado');
            carregarClientes();
        } else {
            document.getElementById('loginError').classList.add('show');
            setTimeout(() => document.getElementById('loginError').classList.remove('show'), 2000);
        }
    };
    
    window.fazerLogout = function() { location.reload(); };
    
    if(localStorage.getItem('twpro_logado') === 'true') {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('conteudoPrincipal').classList.add('desbloqueado');
        logado = true;
        carregarClientes();
    }
    
    window.addEventListener('beforeunload', () => { localStorage.setItem('twpro_logado', logado ? 'true' : 'false'); });
    
})();
</script>
