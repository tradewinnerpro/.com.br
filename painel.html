<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TRADE WINNER PRO · Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#09090d;--surface:#13131a;--border:#1f1f2a;--border2:#2a2a38;--gold:#c9a84c;--gold2:#e8c96a;--text:#e8e8f0;--text2:#8888a8;--green:#3ecf8e;--red:#e05260}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#09090d;color:#e8e8f0;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-box{background:#13131a;border:1px solid #2a2a38;border-radius:16px;padding:3rem 2rem;max-width:400px;width:90%;text-align:center}
    .login-box h1{font-family:'DM Mono',monospace;color:#e8c96a;font-size:1.2rem;margin-bottom:.5rem}
    .login-box p{color:#8888a8;font-size:.8rem;margin-bottom:1.5rem}
    .login-box input{width:100%;padding:.8rem;border-radius:8px;border:1px solid #2a2a38;background:#09090d;color:#e8e8f0;font-size:1rem;text-align:center;margin-bottom:1rem}
    .login-box input:focus{outline:none;border-color:#c9a84c}
    .login-box button{width:100%;padding:.8rem;border-radius:8px;border:none;background:#c9a84c;color:#09090d;font-weight:700;font-size:.95rem;cursor:pointer}
    .login-box button:hover{background:#e8c96a}
    .erro{color:#e05260;font-size:.75rem;margin-top:.5rem;display:none}
    .container{display:none;width:100%;max-width:1000px;margin:2rem auto;padding:0 1rem}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1rem;background:#13131a;border:1px solid #2a2a38;border-radius:12px;margin-bottom:1.5rem}
    .nav-logo{font-family:'DM Mono',monospace;font-size:.9rem;color:#e8c96a;letter-spacing:2px}
    .btn-sair{background:transparent;border:1px solid #e05260;color:#e05260;padding:.4rem 1rem;border-radius:6px;cursor:pointer;font-size:.75rem}
    .btn-sair:hover{background:rgba(224,82,96,0.1)}
    .status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
    @media(max-width:600px){.status-grid{grid-template-columns:repeat(2,1fr)}}
    .status-card{background:#13131a;border:1px solid #2a2a38;border-radius:12px;padding:1rem;text-align:center}
    .status-number{font-family:'DM Mono',monospace;font-size:1.8rem;color:#e8c96a}
    .status-number.green{color:#3ecf8e}.status-number.red{color:#e05260}
    .status-label{font-size:.7rem;color:#8888a8;text-transform:uppercase;margin-top:4px}
    .alerta-novo{background:rgba(37,211,102,0.08);border:2px solid #25d366;border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1.5rem;display:none}
    .alerta-novo.show{display:block}
    .alerta-novo .btn-email{display:inline-block;background:#25d366;color:#fff;padding:.8rem 2rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.9rem;margin:0 .5rem;cursor:pointer;border:none}
    .alerta-novo .btn-email.azul{background:#3b9eff}
    .table-wrapper{overflow-x:auto;border-radius:10px;border:1px solid #2a2a38;background:#13131a}
    table{width:100%;border-collapse:collapse;min-width:700px}
    th{text-align:left;padding:12px 10px;color:#c9a84c;font-size:.65rem;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #c9a84c;font-family:'DM Mono',monospace;background:#13131a}
    td{padding:10px;border-bottom:1px solid #1f1f2a;font-size:.8rem}
    tr:hover td{background:rgba(201,168,76,0.03)}
    .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:.6rem;font-weight:700;color:#fff}
    .badge-ativo{background:rgba(62,207,142,0.2);color:#3ecf8e}
    .badge-vencido{background:rgba(224,82,96,0.2);color:#e05260}
    .chave-texto{font-family:'DM Mono',monospace;font-size:.68rem;color:#e8c96a;background:rgba(201,168,76,0.08);padding:3px 6px;border-radius:4px;display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
    .btn-icon{width:30px;height:30px;border-radius:6px;border:1px solid #2a2a38;background:transparent;color:#8888a8;cursor:pointer;font-size:.8rem;margin:0 2px}
    .btn-icon.whats{border-color:#25d366;color:#25d366}
    .btn-icon.email{border-color:#3b9eff;color:#3b9eff}
    .btn-icon.delete{border-color:#e05260;color:#e05260}
    .busca{width:100%;padding:.65rem;border-radius:8px;border:1px solid #2a2a38;background:#09090d;color:#e8e8f0;margin-bottom:1rem;font-size:.85rem}
    .busca:focus{outline:none;border-color:#c9a84c}
    footer{text-align:center;padding:1.5rem;color:#8888a8;font-size:.7rem}
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="login-box" id="telaLogin">
  <h1>🔐 TRADE WINNER PRO</h1>
  <p>Área restrita · Digite a senha</p>
  <input type="password" id="senhaInput" placeholder="Senha de acesso">
  <button onclick="verificarSenha()">ENTRAR</button>
  <p class="erro" id="erroSenha">Senha incorreta!</p>
</div>

<!-- PAINEL -->
<div class="container" id="painel">
  <nav>
    <span class="nav-logo">⚡ TRADE WINNER PRO</span>
    <div>
      <a href="index.html" style="color:#8888a8;text-decoration:none;font-size:.75rem;margin-right:1rem">← Site</a>
      <button class="btn-sair" onclick="sair()">SAIR</button>
    </div>
  </nav>

  <!-- ALERTA NOVO CADASTRO -->
  <div class="alerta-novo" id="alertaNovo">
    <p style="color:#25d366;font-weight:600;font-size:1rem;">🔔 NOVO CADASTRO!</p>
    <p id="infoNovo" style="font-size:.8rem;color:#8888a8;margin:.5rem 0"></p>
    <button class="btn-email" onclick="enviarEmailAgora()">📧 ENVIAR EMAIL PARA O CLIENTE</button>
    <button class="btn-email azul" onclick="fecharAlerta()">✓ OK, JÁ ENVIEI</button>
  </div>

  <div class="status-grid">
    <div class="status-card"><span class="status-number" id="countTodos">0</span><span class="status-label">Total</span></div>
    <div class="status-card"><span class="status-number green" id="countAtivos">0</span><span class="status-label">Ativos</span></div>
    <div class="status-card"><span class="status-number" id="countVencendo" style="color:#c9a84c">0</span><span class="status-label">Vence Hoje</span></div>
    <div class="status-card"><span class="status-number red" id="countVencidos">0</span><span class="status-label">Vencidos</span></div>
  </div>

  <input type="text" class="busca" id="buscaInput" placeholder="🔍 Pesquisar..." onkeyup="renderizar()">

  <div class="table-wrapper">
    <table>
      <thead><tr><th>Cliente</th><th>Terminal</th><th>Chave</th><th>Plano</th><th>Expira</th><th>Valor</th><th>Ações</th></tr></thead>
      <tbody id="tabelaBody"></tbody>
    </table>
  </div>
  
  <footer>© 2025 TRADE WINNER PRO</footer>
</div>

<!-- SMTPjs -->
<script src="https://smtpjs.com/v3/smtp.js"></script>

<script>
// ⭐ SENHA DO PAINEL
var SENHA_PAINEL = "TWPRO2025";

// ⭐ CONFIGURE A SENHA DE APP DO GMAIL AQUI
var SENHA_APP_GMAIL = "SENHA_DE_APP_AQUI";

var SEU_WATS = "5541999765210";
var LINK_EA = "https://comodoro91-oss.github.io/tradewinner-boleta/TRADE_WINNER_PRO_V1.1.ex5";
var LINK_PDF = "https://comodoro91-oss.github.io/tradewinner-boleta/Manual_TRADE_WINNER.pdf";
var clientes = [];
var ultimoNovo = null; // guarda dados do último cadastro

function verificarSenha(){
  var s = document.getElementById('senhaInput').value;
  if(s === SENHA_PAINEL){
    document.getElementById('telaLogin').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    sessionStorage.setItem('twpro_logado','1');
    carregarDados();
  } else {
    document.getElementById('erroSenha').style.display = 'block';
  }
}

function sair(){
  sessionStorage.removeItem('twpro_logado');
  location.reload();
}

if(sessionStorage.getItem('twpro_logado')==='1'){
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  carregarDados();
}

function carregarDados(){
  var db = localStorage.getItem('twpro_gerador_db');
  if(db){ try{ clientes = JSON.parse(db); }catch(e){ clientes = []; } }
  renderizar();
  verificarNovosCadastros();
}

// ⭐ VERIFICA SE TEM CLIENTE NOVO (sem email enviado)
function verificarNovosCadastros(){
  var naoEnviados = JSON.parse(localStorage.getItem('twpro_nao_enviados')||'[]');
  if(naoEnviados.length > 0){
    ultimoNovo = naoEnviados[0];
    document.getElementById('infoNovo').textContent = 
      '👤 '+ultimoNovo.nome+' | 📧 '+ultimoNovo.email+' | 🔑 '+ultimoNovo.chave;
    document.getElementById('alertaNovo').classList.add('show');
  }
}

// ⭐ ENVIAR EMAIL PARA O CLIENTE
function enviarEmailAgora(){
  if(!ultimoNovo){
    alert('Nenhum cliente pendente!');
    return;
  }
  
  var btn = document.querySelector('.btn-email');
  btn.textContent = '⏳ ENVIANDO...';
  btn.disabled = true;
  
  Email.send({
    Host: "smtp.gmail.com",
    Username: "tradewinnerpro@gmail.com",
    Password: SENHA_APP_GMAIL,
    To: ultimoNovo.email,
    From: "tradewinnerpro@gmail.com",
    Subject: "🎯 TRADE WINNER PRO - Teste Ativado!",
    Body: "Olá "+ultimoNovo.nome+"!\n\n"+
          "✅ Seu teste LATÃO 7 dias GRÁTIS foi ativado!\n\n"+
          "🔑 Chave: "+ultimoNovo.chave+"\n"+
          "📅 Válido até: "+ultimoNovo.expFmt+"\n\n"+
          "📥 Baixe o EA:\n"+LINK_EA+"\n\n"+
          "📘 Manual PDF:\n"+LINK_PDF+"\n\n"+
          "⚙️ Como ativar:\n"+
          "1. Instale o EA no MT5\n"+
          "2. No painel, clique em ATIVAR LICENÇA\n"+
          "3. Cole a chave acima\n\n"+
          "📞 Dúvidas? (41) 99976-5210\n\n"+
          "Bons trades! 📈\n\n"+
          "Equipe TRADE WINNER PRO"
  }).then(function(m){
    alert('✅ Email enviado para: '+ultimoNovo.email);
    removerPendente();
    btn.textContent = '📧 ENVIAR EMAIL PARA O CLIENTE';
    btn.disabled = false;
  }).catch(function(err){
    alert('❌ Erro ao enviar email. Verifique a senha de app.\n\n'+err);
    btn.textContent = '📧 TENTAR NOVAMENTE';
    btn.disabled = false;
  });
}

function removerPendente(){
  var naoEnviados = JSON.parse(localStorage.getItem('twpro_nao_enviados')||'[]');
  naoEnviados.shift();
  localStorage.setItem('twpro_nao_enviados', JSON.stringify(naoEnviados));
  ultimoNovo = null;
  document.getElementById('alertaNovo').classList.remove('show');
}

function fecharAlerta(){
  removerPendente();
}

// ⭐ ENVIAR EMAIL PARA CLIENTE PELO BOTÃO NA TABELA
function enviarEmailCliente(id){
  var c = clientes.find(function(x){ return x.id == id; });
  if(!c) return;
  
  if(SENHA_APP_GMAIL === 'SENHA_DE_APP_AQUI'){
    alert('⚠️ Configure a senha de app do Gmail no código!');
    return;
  }
  
  var exp = new Date(c.expira);
  
  Email.send({
    Host: "smtp.gmail.com",
    Username: "tradewinnerpro@gmail.com",
    Password: SENHA_APP_GMAIL,
    To: c.email,
    From: "tradewinnerpro@gmail.com",
    Subject: "🎯 TRADE WINNER PRO - Sua Licença",
    Body: "Olá "+c.nome+"!\n\n"+
          "✅ Seu plano "+c.plano+" está ativo!\n\n"+
          "🔑 Chave: "+c.chave+"\n"+
          "📅 Válido até: "+exp.toLocaleDateString('pt-BR')+"\n\n"+
          "📥 EA: "+LINK_EA+"\n"+
          "📘 PDF: "+LINK_PDF+"\n\n"+
          "📞 Suporte: (41) 99976-5210"
  }).then(function(m){
    alert('✅ Email enviado para: '+c.email);
  }).catch(function(err){
    alert('❌ Erro: '+err);
  });
}

function renderizar(){
  var busca = (document.getElementById('buscaInput').value||'').toLowerCase();
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  
  var lista = clientes.filter(function(c){
    return !busca || c.nome.toLowerCase().includes(busca) || c.whats.includes(busca) || c.terminal.includes(busca);
  });
  lista.sort(function(a,b){ return new Date(a.expira) - new Date(b.expira); });
  
  var t=0, a=0, v=0, vc=0;
  clientes.forEach(function(c){
    var exp = new Date(c.expira); exp.setHours(0,0,0,0);
    var d = Math.ceil((exp - hoje)/86400000);
    t++; if(d>0) a++; else if(d===0) v++; else vc++;
  });
  document.getElementById('countTodos').textContent = t;
  document.getElementById('countAtivos').textContent = a;
  document.getElementById('countVencendo').textContent = v;
  document.getElementById('countVencidos').textContent = vc;
  
  var tb = document.getElementById('tabelaBody');
  if(!lista.length){
    tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:#8888a8">Nenhum cliente</td></tr>';
    return;
  }
  
  tb.innerHTML = lista.map(function(c){
    var exp = new Date(c.expira);
    var d = Math.ceil((exp - hoje)/86400000);
    var sc = d < 0 ? 'badge-vencido' : 'badge-ativo';
    var st = d < 0 ? 'VENCIDO' : 'ATIVO';
    return '<tr>'+
      '<td><b>'+c.nome+'</b><br><span style="font-size:.68rem;color:#8888a8">📱 '+c.whats+'<br>📧 '+c.email+'</span></td>'+
      '<td>'+c.terminal+'</td>'+
      '<td><span class="chave-texto" onclick="copiar(\''+c.id+'\')">'+c.chave+'</span></td>'+
      '<td><span class="badge" style="background:'+(c.plano==='LATAO'?'#CD7F32':c.plano==='BRONZE'?'#8B6914':c.plano==='PRATA'?'#7D8794':c.plano==='OURO'?'#DAA520':c.plano==='DIAMANTE'?'#6A5ACD':'#C0392B')+'">'+c.plano+'</span></td>'+
      '<td>'+exp.toLocaleDateString('pt-BR')+'<br><span class="badge '+sc+'">'+st+'</span></td>'+
      '<td>R$ '+(c.valor||0).toFixed(2)+'</td>'+
      '<td>'+
        '<button class="btn-icon whats" onclick="whatsCliente(\''+c.id+'\')" title="WhatsApp">📱</button>'+
        '<button class="btn-icon email" onclick="enviarEmailCliente(\''+c.id+'\')" title="Enviar Email">📧</button>'+
        '<button class="btn-icon delete" onclick="remover(\''+c.id+'\')" title="Remover">🗑️</button>'+
      '</td>'+
    '</tr>';
  }).join('');
}

window.copiar = function(id){
  var c = clientes.find(function(x){ return x.id == id; });
  if(c){ navigator.clipboard.writeText(c.chave).then(function(){ alert('✅ Copiado!'); }); }
};

window.whatsCliente = function(id){
  var c = clientes.find(function(x){ return x.id == id; });
  if(!c) return;
  var exp = new Date(c.expira);
  var m = '🎯 *TRADE WINNER PRO*\n\n✅ Plano *'+c.plano+'* ativo!\n🔑 Chave: '+c.chave+'\n📅 Até: '+exp.toLocaleDateString('pt-BR')+'\n📥 EA: '+LINK_EA+'\n📘 PDF: '+LINK_PDF;
  window.open('https://wa.me/'+c.whats.replace(/\D/g,'')+'?text='+encodeURIComponent(m),'_blank');
};

window.remover = function(id){
  if(!confirm('Remover?')) return;
  clientes = clientes.filter(function(c){ return c.id != id; });
  localStorage.setItem('twpro_gerador_db', JSON.stringify(clientes));
  renderizar();
};

setInterval(function(){
  var db = localStorage.getItem('twpro_gerador_db');
  if(db){
    try{
      var novos = JSON.parse(db);
      if(JSON.stringify(novos) !== JSON.stringify(clientes)){
        clientes = novos;
        renderizar();
        verificarNovosCadastros();
      }
    }catch(e){}
  }
}, 3000);
</script>
</body>
</html>
