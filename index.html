<script>
document.querySelectorAll('a[href^="#"]').forEach(a=>{a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href'));if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth',block:'start'})}})});
</script>

<script>
(function(){
  var SALT="TWPRO-SALT-2025";
  var LINK_EA="https://comodoro91-oss.github.io/tradewinner-boleta/TRADE_WINNER_PRO_V1.1.ex5";
  var LINK_PDF="https://comodoro91-oss.github.io/tradewinner-boleta/Manual_TRADE_WINNER.pdf";
  var SEU_WATS="5541999765210";

  function gerarChave(terminal){
    var d=terminal+SALT,h=0;
    for(var i=0;i<d.length;i++){var c=d.charCodeAt(i);h=((h<<5)-h)+c;h=h&0x7FFFFFFF}
    var a=Math.abs(h),p1=a%10000,p2=Math.floor(a/10000)%10000,p3=Math.floor(a/100000000)%10000;
    var l="ABCDEFGHJKLMNPQRSTUVWXYZ";
    return "LATAO-"+l.charAt(p1%l.length)+l.charAt(p2%l.length)+l.charAt(p3%l.length)+"-"+String(p1).padStart(4,'0')+"-"+String(p2%1000).padStart(3,'0')+"-"+String(p3%1000).padStart(3,'0');
  }

  function verificaTeste(terminal){
    var t=JSON.parse(localStorage.getItem('twpro_testes_db')||'{}');
    if(t[terminal]){
      var diff=Math.ceil((new Date()-new Date(t[terminal].dataSolicitacao))/86400000);
      if(diff<=7) return {ok:false,msg:'⚠️ Terminal já tem teste ativo! Dias restantes: '+(7-diff)};
      if(t[terminal].totalTestes>=2) return {ok:false,msg:'⚠️ Limite de 2 testes atingido!'};
    }
    return {ok:true};
  }

  var form=document.getElementById('formTeste');
  if(!form) return;

  form.addEventListener('submit',function(e){
    e.preventDefault();

    var nome=document.getElementById('testeNome').value.trim();
    var whatsapp=document.getElementById('testeWhats').value.trim();
    var email=document.getElementById('testeEmail').value.trim();
    var terminal=document.getElementById('testeTerminal').value.trim();

    if(!nome||!whatsapp||!email||!terminal){alert('⚠️ Preencha todos os campos!');return;}

    var v=verificaTeste(terminal);
    if(!v.ok){alert(v.msg);return;}

    var chave=gerarChave(terminal);
    var hoje=new Date();
    var expira=new Date(hoje);expira.setDate(hoje.getDate()+7);
    var expFmt=expira.toLocaleDateString('pt-BR');

    // 1. Salva no localStorage
    var clientes=JSON.parse(localStorage.getItem('twpro_gerador_db')||'[]');
    clientes.push({id:Date.now(),nome:nome,whats:whatsapp,email:email,terminal:terminal,chave:chave,plano:'LATAO',dias:7,valor:0,dataCompra:hoje.toISOString().split('T')[0],dataCadastro:hoje.toISOString(),expira:expira.toISOString()});
    localStorage.setItem('twpro_gerador_db',JSON.stringify(clientes));

    var nots=JSON.parse(localStorage.getItem('twpro_notificacoes')||'[]');
    nots.unshift({id:Date.now(),tipo:'teste',nome:nome,whatsapp:whatsapp,email:email,terminal:terminal,chave:chave,plano:'LATAO 7 dias',data:hoje.toISOString(),lida:false});
    localStorage.setItem('twpro_notificacoes',JSON.stringify(nots));

    var testes=JSON.parse(localStorage.getItem('twpro_testes_db')||'{}');
    if(!testes[terminal]) testes[terminal]={totalTestes:0,historico:[]};
    testes[terminal].totalTestes++;testes[terminal].dataSolicitacao=hoje.toISOString();
    localStorage.setItem('twpro_testes_db',JSON.stringify(testes));

    // 2. Envia email para o CLIENTE via Formspree xrerdvdw (Auto-Responder)
    var fd=new FormData();
    fd.append('nome',nome);
    fd.append('email',email);
    fd.append('whatsapp',whatsapp);
    fd.append('terminal_id',terminal);
    fd.append('chave_gerada',chave);
    fd.append('link_ea',LINK_EA);
    fd.append('link_pdf',LINK_PDF);
    fd.append('plano','LATAO 7 dias');
    fd.append('validade',expFmt);
    fd.append('_subject','🎯 TRADE WINNER PRO - Teste Ativado!');
    fetch('https://formspree.io/f/xrerdvdw',{method:'POST',body:fd,headers:{'Accept':'application/json'}})
    .then(function(r){console.log('✅ Email enviado para cliente: '+email);})
    .catch(function(err){console.log('⚠️ Erro:',err);});

    // 3. WhatsApp para o CLIENTE
    var nc=whatsapp.replace(/\D/g,'');
    var mc='🎯 *TRADE WINNER PRO - Teste Ativado!*\n\n'+
           'Olá *'+nome+'*!\n\n'+
           '✅ Seu teste LATÃO 7 dias foi ativado!\n\n'+
           '🔑 *Chave:* '+chave+'\n'+
           '📅 *Válido até:* '+expFmt+'\n\n'+
           '📥 *EA:* '+LINK_EA+'\n\n'+
           '📘 *PDF:* '+LINK_PDF+'\n\n'+
           '📞 Dúvidas? (41) 99976-5210\n\n'+
           'Bons trades! 📈';
    window.open('https://wa.me/'+nc+'?text='+encodeURIComponent(mc),'_blank');

    // 4. WhatsApp para VOCÊ
    var mp='🔔 *NOVO TESTE LATÃO*\n\n'+
           '👤 '+nome+'\n'+
           '📱 '+whatsapp+'\n'+
           '📧 '+email+'\n'+
           '🖥️ '+terminal+'\n'+
           '🔑 '+chave+'\n'+
           '📅 '+hoje.toLocaleDateString('pt-BR');
    window.open('https://wa.me/'+SEU_WATS+'?text='+encodeURIComponent(mp),'_blank');

    form.reset();
    alert('✅ PRONTO!\n\n🔑 '+chave+'\n👤 '+nome+'\n📅 Até '+expFmt+'\n\n📱 WhatsApp aberto!\n📧 Email enviado!');
  });
})();
</script>
